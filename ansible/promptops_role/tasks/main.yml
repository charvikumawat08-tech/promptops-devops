---
- name: Install Python and pip
  apt:
    name:
      - python3
      - python3-pip
    state: present
    update_cache: yes

- name: Create application directory
  file:
    path: /app
    state: directory

- name: Copy PromptOps application files
  copy:
    src: "../../../{{ item }}"
    dest: "/app/{{ item }}"
  loop:
    - app.py
    - requirements.txt
  notify: Restart PromptOps

- name: Install Python dependencies
  pip:
    requirements: /app/requirements.txt
